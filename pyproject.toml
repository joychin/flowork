[project]
name = "flowork"
version = "0.1.0"
description = "A headless, extensible approval workflow engine (token-based, BPMN-aligned vocabulary)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "flowork" }]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "asteval>=0.9.29",
    "typer>=0.12",
    "rich>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
flowork = "flowork.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["flowork"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"flowork/persistence/orm.py" = ["RUF012"]  # SQLAlchemy mapped_column(default=dict) 惯例
"flowork/cli/*.py" = ["B008"]              # typer Argument/Option 惯例

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# RUF001/002/003：中文全角标点被误判为 ambiguous unicode，中文文档项目标准做法是关闭
ignore = ["N818", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["asteval.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["flowork"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
