[project]
name = "flowork"
version = "0.1.0"
description = "A headless, extensible approval workflow engine (token-based, BPMN-aligned vocabulary)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "flowork" }]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "asteval>=0.9.29",
    "typer>=0.12",
    "rich>=13.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.142.1",
    "uvicorn[standard]>=0.54.0",
    "cel-python>=0.5.0",
    "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260906",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
flowork = "flowork.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["flowork"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.importlinter]
root_package = "flowork"

[[tool.importlinter.contracts]]
name = "内核不得 import 插件包（contrib）——官方插件不吃小灶（spec §9 铁律）"
type = "forbidden"
source_modules = [
    "flowork.definitions",
    "flowork.runtime",
    "flowork.expr",
    "flowork.spi",
    "flowork.events",
    "flowork.tasks",
    "flowork.participants",
    "flowork.persistence",
    "flowork.engine",
    "flowork.jobs",
    "flowork.errors",
    "flowork.clock",
]
forbidden_modules = ["flowork.contrib"]
ignore_imports = []
# 注：definitions→runtime→engine 的传递链是既有分层现实（runtime.behavior 懒加载
# engine.routing），分层拆解不在本契约范围——随内核 v2 模块重排（spec §15）再立。

[tool.ruff.lint.per-file-ignores]
"flowork/persistence/orm.py" = ["RUF012", "E402"]  # SQLAlchemy mapped_column 惯例 + 尾部再导出 v2 表（同 Base 元数据的刻意结构）
"flowork/cli/*.py" = ["B008"]              # typer Argument/Option 惯例

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# RUF001/002/003：中文全角标点被误判为 ambiguous unicode，中文文档项目标准做法是关闭
ignore = ["N818", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["asteval.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["flowork"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
