[project]
name = "flowork"
version = "0.1.0"
description = "An embeddable BPM workflow engine for Python — token-based kernel, standalone deployment, pluggable REST/MCP surfaces and expression functions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "flowork" }]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "apscheduler>=3.11.3",
    "fastapi>=0.142.1",
    "uvicorn[standard]>=0.54.0",
    "cel-python>=0.5.0",
    "jsonschema>=4.26.0",
    "alembic>=1.13",
    "mcp>=1.10.1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0.12.20260906",
    "httpx>=0.28.1",
    "import-linter>=2.15",
    "types-jsonschema>=4.26.0.20261006",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
flowork = "flowork.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["flowork"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.importlinter]
root_package = "flowork"

[[tool.importlinter.contracts]]
name = "内核不得 import 插件包（contrib）——官方插件不吃小灶（spec §9 铁律）"
type = "forbidden"
source_modules = [
    "flowork.definitions",
    "flowork.runtime",
    "flowork.expr",
    "flowork.spi",
    "flowork.events",
    "flowork.tasks",
    "flowork.participants",
    "flowork.persistence",
    "flowork.engine",
    "flowork.jobs",
    "flowork.directory",
    "flowork.errors",
    "flowork.clock",
]
forbidden_modules = ["flowork.contrib"]
ignore_imports = []
# 注：definitions→runtime→engine 的传递链是既有分层现实（runtime.behavior 懒加载
# engine.routing），分层拆解不在本契约范围——随内核 v2 模块重排（spec §15）再立。

[[tool.importlinter.contracts]]
name = "内核与公开门面不得 import 投影/插件（cli 与 contrib 全量）——依赖单向：投影/插件→api→内核"
type = "forbidden"
source_modules = [
    "flowork.api",
    "flowork.definitions",
    "flowork.runtime",
    "flowork.expr",
    "flowork.spi",
    "flowork.events",
    "flowork.tasks",
    "flowork.participants",
    "flowork.persistence",
    "flowork.engine",
    "flowork.jobs",
    "flowork.directory",
    "flowork.errors",
    "flowork.clock",
]
forbidden_modules = ["flowork.cli", "flowork.contrib"]
ignore_imports = []
# 注 1：「投影/插件只准直接 import flowork.api」的正向纪律由
# tests/test_projection_surface.py 静态扫描守卫——forbidden 契约按传递闭包判定，
# flowork.api 作为 re-export 聚合器必然链到内部包，正向规则无法用 forbidden 表达。
# 注 2：公开面符号冻结于 flowork/api.py（快照测试 tests/test_api_surface.py 守卫）；
# 内核重排（spec §15）只准动内部件。宿主与 AI 同样只准依赖 flowork.api。

[tool.ruff.lint.per-file-ignores]
"flowork/persistence/orm.py" = ["RUF012", "E402"]  # SQLAlchemy mapped_column 惯例 + 尾部再导出 v2 表（同 Base 元数据的刻意结构）
"flowork/cli/*.py" = ["B008"]              # typer Argument/Option 惯例

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# RUF001/002/003：中文全角标点被误判为 ambiguous unicode，中文文档项目标准做法是关闭
ignore = ["N818", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q --strict-markers -m "not quarantined and not randomized and not needs_http and not needs_postgres"'
markers = [
    "slow: 跑得久但确定的重测试（默认仍跑，可用 -m 'not slow' 跳过）",
    "quarantined: 已知 flaky，默认跳过；修复前不得依赖其绿灯",
    "randomized: 随机流程结构生成测试，默认排除；-m randomized 显式运行",
    "needs_http: 需要起 HTTP 服务的插件层测试，默认排除",
    "needs_postgres: 需要 PostgreSQL 的冒烟测试，默认排除；FLOWORK_TEST_PG_URL 指定现成实例，未设则自动 docker 起删（无 docker 整组跳过）",
]

[tool.coverage.run]
source = ["flowork"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
